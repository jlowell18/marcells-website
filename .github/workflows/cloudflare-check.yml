# Verifies the Cloudflare secrets from GitHub's side (this workspace can't reach
# Cloudflare directly). Never prints the token. Writes a small status file to
# the `status` branch: token valid?, zone found?, Pages access?
name: Cloudflare check
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/cloudflare-check.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify token, zone and Pages access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          j() { curl -sS "$@" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"; }
          V=$(j https://api.cloudflare.com/client/v4/user/tokens/verify)
          TOK_OK=$(echo "$V" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('success') and d['result'].get('status'))")
          TOK_ERR=$(echo "$V" | python3 -c "import json,sys; d=json.load(sys.stdin); print('; '.join(e.get('message','') for e in d.get('errors',[])))")
          Z=$(j "https://api.cloudflare.com/client/v4/zones?name=marcellspaper.com")
          ZONE_ID=$(echo "$Z" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')")
          ZONE_ERR=$(echo "$Z" | python3 -c "import json,sys; d=json.load(sys.stdin); print('; '.join(e.get('message','') for e in d.get('errors',[])))")
          DNS_N=""; DNS_ERR=""
          if [ -n "$ZONE_ID" ]; then
            D=$(j "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100")
            DNS_N=$(echo "$D" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('result') or []))")
            DNS_ERR=$(echo "$D" | python3 -c "import json,sys; d=json.load(sys.stdin); print('; '.join(e.get('message','') for e in d.get('errors',[])))")
            echo "$D" | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          rows=[{'type':r['type'],'name':r['name'],'content':(r['content'][:60] if r['type'] in ('A','AAAA','CNAME') else '(hidden)'),'proxied':r.get('proxied')} for r in d.get('result') or [] if r['type'] in ('A','AAAA','CNAME')]
          json.dump(rows, open('dns.json','w'), indent=1)"
          fi
          P=$(j "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects")
          PAGES_OK=$(echo "$P" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('success'))")
          PAGES_ERR=$(echo "$P" | python3 -c "import json,sys; d=json.load(sys.stdin); print('; '.join(e.get('message','') for e in d.get('errors',[])))")
          PAGES_N=$(echo "$P" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('result') or []))")
          python3 - <<PY
          import json, datetime
          out = {"checked_at": datetime.datetime.utcnow().isoformat()+"Z",
                 "token_status": "$TOK_OK", "token_error": "$TOK_ERR",
                 "zone_found": bool("$ZONE_ID"), "zone_error": "$ZONE_ERR",
                 "dns_records_readable": "$DNS_N", "dns_error": "$DNS_ERR",
                 "account_id_set": bool("$CF_ACCOUNT"), "pages_access": "$PAGES_OK", "pages_error": "$PAGES_ERR", "pages_projects": "$PAGES_N"}
          json.dump(out, open("cloudflare-status.json","w"), indent=1)
          print(json.dumps(out, indent=1))
          PY
      - name: Publish status to the `status` branch
        run: |
          git config user.name "cloudflare-check"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp cloudflare-status.json /tmp/out/ && [ -f dns.json ] && cp dns.json /tmp/out/ || true
          git fetch origin status || true
          git checkout -B status
          git rm -rfq . || true
          cp /tmp/out/* . && git add -A && git commit -qm "cloudflare check $(date -u +%FT%TZ)" && git push -f origin status
